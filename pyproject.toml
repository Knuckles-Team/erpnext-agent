[build-system]
requires = [ "setuptools>=84.0.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "erpnext-agent"
version = "2.3.5"
description = "ERPNext and Frappe REST/RPC MCP Server for Agentic AI!"
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
dependencies = [ "scion-sdk[mcp]>=0.6.0,<0.7.0", "requests>=2.34.2",]
[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.license]
text = "MIT"

[project.optional-dependencies]
test = [ "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
erpnext-mcp = "scion_sdk.cli:serve"

[project.entry-points."scion_sdk.prompt_providers"]
erpnext-agent = "erpnext_agent.prompts"

# CONCEPT:AU-KG.ontology.package-federation-migration — federate this package's OWL/RDF ontology module into the
# scion-sdk hub (DocTypes, customers, sales orders). Resolved via
# iter_provider_dirs like the skill/prompt providers.

# The one declared connector identity: the fleet name (SCION-CONNECTOR-CONTROL-R071).
[project.entry-points."scion_sdk.connector"]
erpnext-mcp = "erpnext_agent:connector"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [ "pytest-timeout>=2.4.0",]

[tool.setuptools.package-data]
erpnext_agent = [ "mcp_config.json", "agent_data/**", "prompts/**", "skills/**", "ontology/**", "connectors/**",]
scion_erp_guard = [ "modules.txt", "**/*.json",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".", "frappe_app",]
include = [ "erpnext_agent*", "scion_erp_guard*",]

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]


[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]

[tool.pytest.ini_options]
markers = ["concept(id): associates a test with an existing concept identifier", "spec(id): associates a test with a specification requirement"]

[tool.pipelines.container]
limits = {"mcp" = {"memory_limit_env" = "AGENT_CONTAINER_MEMORY_LIMIT", "memory_limit" = "4g", "cpu_limit_env" = "AGENT_CONTAINER_CPU_LIMIT", "cpu_limit" = "2.0"}}
compose_env = ["ERPNEXT_URL", "ERPNEXT_TOKEN"]

[tool.pipelines.codespell]
exclude = [".specify"]
